name: Supabase Ping

on:
  schedule:
    - cron: "0 6 * * 1,4" # Pazartesi ve Perşembe, 06:00 UTC
  workflow_dispatch:       # Elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://doaeylatedhpnwqqtvpb.supabase.co/rest/v1/members?select=id&limit=1" \
            -H "apikey: sb_publishable_tRsM1gq-b2Pfa9Rh9uXpoA_G2U1BNFJ")
          echo "HTTP $code"
          if [ "$code" -ne 200 ]; then
            echo "Ping başarısız"
            exit 1
          fi

      # GitHub, 60 gün repo etkinliği olmayan depolarda zamanlanmış işleri durdurur.
      # Son commit 45 günden eskiyse boş bir commit atılır, sayaç sıfırlanır.
      - name: Repo etkinliğini canlı tut
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Son commit: $days gün önce"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
            echo "Boş commit atıldı"
          fi
